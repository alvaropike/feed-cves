name: Reiniciar los avisos de Telegram

# Borra .notificado.json del servidor y ya está. La pasada siguiente encuentra
# que no hay estado, entra por el camino de "primera ejecución" de
# notificarTelegram() —siembra todo lo que hay en el feed sin avisar de nada— y a
# partir de ahí solo salen las vulnerabilidades que aparezcan de nuevo.
#
# Para qué sirve: cuando los mensajes del grupo se han borrado a mano, el estado
# se queda apuntando a mensajes que ya no existen, y lo que hay anotado ya no se
# corresponde con lo que se ve en Telegram. Reiniciar deja las dos cosas en cero a
# la vez.
#
# No pide nada a la EUVD ni a cve.org: es un borrado por FTP y se acabó. La
# siembra la hace la pasada siguiente con los datos que ya se estaba bajando.
#
# Lo que NO hace: borrar mensajes ya publicados. Para eso está limpiar-kev.yml.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Sí, borra el estado y empieza de cero (sin marcar no hace nada)'
        type: boolean
        default: false

# El mismo grupo que el sync: si una pasada está a medias, esperamos a que acabe
# en vez de quitarle el fichero de debajo.
concurrency:
  group: sync-euvd
  cancel-in-progress: false

jobs:
  reiniciar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Comprobar que se ha confirmado
        if: ${{ !inputs.confirmar }}
        run: |
          echo "Sin marcar 'confirmar' no toco nada." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Borrar el estado del servidor
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Se guarda una copia antes de borrar, por si hubiera que volver atrás.
          # rm no lleva fail-exit: si el fichero ya no está, el trabajo está hecho.
          lftp <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 15
          set net:reconnect-interval-base 5
          set xfer:clobber on
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          get .notificado.json -o antes.json || echo "(no habia estado que copiar)"
          rm -f .notificado.json
          echo "--- lo que queda:"
          ls -a
          bye
          EOF

          if [ -s antes.json ]; then
            node -e 'const s=require("./antes.json");console.log("Estado borrado:",Object.keys(s.avisadas||{}).length,"apuntes.")' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No habia estado previo; no hay nada que reiniciar." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar la copia por si acaso
        uses: actions/upload-artifact@v4
        with:
          name: notificado-antes-del-reinicio
          path: antes.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Qué pasa ahora
        run: |
          {
            echo ''
            echo 'La pasada siguiente sembrará el estado con lo que haya en el feed **sin avisar**.'
            echo 'A partir de la de después, solo llega lo que aparezca nuevo.'
          } >> "$GITHUB_STEP_SUMMARY"
