name: Sync EUVD

# Sustituye al cron del hosting. El runner es efímero, así que el estado que el
# sync necesita entre pasadas (las cachés y .notificado.json) vive en el
# servidor: se baja antes de sincronizar y se sube después.
#
# euvd_sync.mjs no tiene dependencias fuera de Node, así que no hace falta
# npm install: solo checkout, Node y a correr.

on:
  schedule:
    # Solo la pasada completa. La rápida la dispara QStash cada 10 minutos, porque
    # el schedule de GitHub no es puntual: se encola y se descarta en periodos de
    # carga alta, y pidiendo cada 15 minutos salían 3 pasadas en 8 horas.
    #
    # Esta se queda aquí a propósito, como red de seguridad: si QStash se cae o el
    # token caduca, la web sigue actualizándose cuatro veces al día en vez de
    # quedarse congelada sin que nadie se entere.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de la pasada'
        type: choice
        options: [rapido, completo]
        default: rapido

# Una pasada a la vez, igual que el cerrojo del script: dos ejecuciones
# solapadas se pisarían las cachés en el servidor.
concurrency:
  group: sync-euvd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decidir el modo de la pasada
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          PROGRAMADO: ${{ github.event.schedule }}
          ENTRADA: ${{ inputs.modo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            modo="$ENTRADA"
          elif [ "$PROGRAMADO" = "17 0,6,12,18 * * *" ]; then
            modo="completo"
          else
            modo="rapido"
          fi
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          echo "Pasada: $modo"

      # Chivato de frescura. Las pasadas rápidas las dispara QStash cada 10 minutos;
      # si deja de hacerlo —schedule borrado, PAT caducado, cuenta suspendida— no
      # falla nada ni sale nada en rojo: simplemente no corre nadie. Lo único que
      # lo delata es que la hora del JSON que sirve la web deja de moverse.
      #
      # Se mira antes de sincronizar, que es cuando ese dato es todavía el de la
      # pasada anterior. Pide solo los primeros 200 bytes: "generado" es el primer
      # campo del JSON, así que no hay que bajarse los 6 MB para saber la hora, y
      # es la hora que estampó el sync, no la del fichero en el disco del hosting.
      #
      # Quien acaba dando la voz es la completa de cada 6 h: si QStash se cae, las
      # rápidas no corren y por tanto tampoco comprueban nada. Seis horas de
      # retraso en el aviso, frente a no enterarse nunca, que es lo que pasaba con
      # el cron del hosting.
      #
      # Nunca falla el job: un chivato que tumba la pasada por no poder leer una
      # cabecera hace más daño que el fallo que vigila.
      - name: Comprobar que la web sigue fresca
        env:
          # Variable del repo (Settings → Variables), no secreto: es la URL pública
          # del feed. Sin ella el chivato queda apagado y lo dice en el resumen.
          SITIO_URL: ${{ vars.SITIO_URL }}
          # Cuatro pasadas rápidas perdidas. Bastante margen para no avisar por un
          # parpadeo del FTP, y bastante poco para enterarse el mismo día.
          UMBRAL_MIN: 45
          MODO: ${{ steps.modo.outputs.modo }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_AVISOS: ${{ secrets.TELEGRAM_CHAT_AVISOS }}
          TELEGRAM_CHAT_KEV: ${{ secrets.TELEGRAM_CHAT_KEV }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$SITIO_URL" ]; then
            echo "Sin la variable SITIO_URL: el chivato de frescura está apagado." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          url="${SITIO_URL%/}/data/cves.json"
          # El ?t= es el mismo truco que usa la web: el .htaccess pone cinco
          # minutos de caché y aquí interesa el fichero de verdad, no el del proxy.
          cabeza=$(curl -sS --max-time 25 -r 0-200 -H 'Cache-Control: no-cache' \
            "$url?t=$(date -u +%s)" 2>&1) || true
          generado=$(printf '%s' "$cabeza" | sed -n 's/.*"generado":"\([^"]*\)".*/\1/p')

          if [ -z "$generado" ]; then
            echo "No he podido leer 'generado' de $url; me callo en vez de dar una falsa alarma."
            # Pero sin dejarlo mudo: si esto empieza a salir en todas las pasadas,
            # lo que está roto es el chivato y hay que verlo en el log.
            [ -n "$cabeza" ] && echo "  lo que contestó: $cabeza"
            exit 0
          fi

          edad=$(( ( $(date -u +%s) - $(date -u -d "$generado" +%s) ) / 60 ))
          echo "Lo publicado se generó hace $edad min ($generado); el umbral está en $UMBRAL_MIN."
          echo "Frescura al empezar: $edad min (umbral $UMBRAL_MIN)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$edad" -gt "$UMBRAL_MIN" ]; then
            aviso="⏳ <b>El feed lleva $edad min sin actualizarse</b>"
            aviso="$aviso\nLo último se generó a las $generado, y las pasadas rápidas van cada 10 min."
            aviso="$aviso\nMira el schedule de QStash y que el PAT siga vivo; esta pasada ($MODO) sigue su curso."
            sh .github/avisar.sh "$(printf '%b' "$aviso")"
          fi

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Falla a propósito si no conecta: sin este corte, unas credenciales
      # malas se confundirían con "no hay estado previo" y el sync arrancaría
      # de cero, pidiendo los 5.000 títulos a cve.org y re-sembrando Telegram.
      #
      # La cuenta FTP entra directamente en el docroot del subdominio, así que
      # todo lo demás va con rutas relativas. El "ls data" lo verifica: si
      # algún día la cuenta aterrizara en otro sitio, esto corta aquí en vez de
      # subir el feed a un directorio que nadie sirve, que es exactamente el
      # fallo mudo que traía el cron del hosting.
      #
      # Los timeouts van cortos y con reintentos a propósito. El login entra por
      # el canal de control, pero cada listado y cada transferencia abre otro
      # canal de datos aparte, y el FTP del hosting a veces no lo abre: de los
      # primeros 59 runs, 5 murieron aquí en el "ls", nunca en el login. Con los
      # valores por defecto un parpadeo se comía 4,5 minutos de espera y tumbaba
      # la pasada; así se reintenta a los 5 s y solo falla si el hosting está
      # caído de verdad, que es cuando el correo de fallo dice algo.
      - name: Comprobar la conexión FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          echo "--- directorio al entrar por FTP:"
          pwd
          echo "--- que hay aqui:"
          ls
          echo "--- data/ (si esto falla, no estamos en el docroot):"
          ls data
          bye
          EOF

      # Sin este paso, cada ejecución empezaría de cero: pediría los 5.000
      # títulos a cve.org, las ~1.300 fichas del catálogo de KEV, y Telegram
      # re-sembraría sin avisar nunca de nada.
      #
      # Aquí sí se toleran las ausencias (fail-exit queda en no): la primera
      # vez no habrá .notificado.json, y eso es correcto, no un error.
      - name: Traer el estado previo del servidor
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p public/data
          lftp <<EOF || true
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set xfer:clobber on
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          mget -O public/data "data/cve_meta.json"
          mget -O public/data "data/cwes_nvd.json"
          mget -O public/data "data/epss.json"
          mget -O public/data "data/kev_extra.json"
          get .notificado.json -o .notificado.json
          bye
          EOF
          echo "--- estado recuperado:"
          ls -la public/data/ 2>/dev/null || true
          if [ -f .notificado.json ]; then
            node -e 'const s=require("./.notificado.json");console.log("  .notificado.json:",Object.keys(s.avisadas||{}).length,"entradas, sembrado",s.sembrado)'
          else
            echo "  (sin .notificado.json: Telegram sembrará esta pasada sin avisar)"
          fi

      - name: Sincronizar
        env:
          MODO: ${{ steps.modo.outputs.modo }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_KEV: ${{ secrets.TELEGRAM_CHAT_KEV }}
          TELEGRAM_CHAT_CRITICAS: ${{ secrets.TELEGRAM_CHAT_CRITICAS }}
          TELEGRAM_CHAT_ALTAS: ${{ secrets.TELEGRAM_CHAT_ALTAS }}
          TELEGRAM_CHAT_MEDIAS: ${{ secrets.TELEGRAM_CHAT_MEDIAS }}
          TELEGRAM_CHAT_BAJAS: ${{ secrets.TELEGRAM_CHAT_BAJAS }}
          TELEGRAM_CHAT_SIN_PUNTUAR: ${{ secrets.TELEGRAM_CHAT_SIN_PUNTUAR }}
          # Respaldo para el montaje de un solo grupo: recoge lo que no tenga
          # sala propia, filtrado por el umbral. Vacíos si no se definen, que es
          # el valor por defecto del script.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_UMBRAL: ${{ secrets.TELEGRAM_UMBRAL }}
          # Freno de mano, variable del repo (Settings -> Variables): a 1 la pasada
          # publica la web como siempre pero no toca Telegram. Se quita borrando la
          # variable o poniendola a 0; no hace falta tocar el codigo.
          TELEGRAM_PAUSA: ${{ vars.TELEGRAM_PAUSA }}
          # Arranque en frio, tambien variable del repo: marca ISO por debajo de la
          # cual nada entra en el feed. Vacia = sin corte. Ver el README.
          SYNC_DESDE: ${{ vars.SYNC_DESDE }}
        run: |
          if [ "$MODO" = "completo" ]; then
            node euvd_sync.mjs
          else
            node euvd_sync.mjs --rapido
          fi

      # Se sube a .tmp y se renombra, que es lo que hacía escribir_json() en el
      # servidor: una subida de 6 MB por FTP no es atómica y un visitante podría
      # llevarse el JSON a medias. El .htaccess ya bloquea los .tmp.
      - name: Publicar en el hosting
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set xfer:clobber on
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          put public/data/cves.json     -o "data/cves.json.tmp"
          mv "data/cves.json.tmp" "data/cves.json"
          put public/data/cve_meta.json -o "data/cve_meta.json"
          put public/data/cwes_nvd.json -o "data/cwes_nvd.json"
          put public/data/epss.json     -o "data/epss.json"
          put public/data/kev_extra.json -o "data/kev_extra.json"
          put .notificado.json          -o .notificado.json
          bye
          EOF

      - name: Resumen
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("public/data/cves.json","utf8"));
            console.log("generado:", s.generado, "| modo:", s.modo, "| total:", s.total);
          ' >> "$GITHUB_STEP_SUMMARY"

      # El fallo que importa no es el que sale en rojo en la pestaña de Actions:
      # es el que nadie mira. GitHub manda un correo al dueño del repo cuando un
      # workflow programado falla, pero no cuando lo lanza QStash por
      # workflow_dispatch — que son 143 de las 144 pasadas del día. Sin esto, el
      # FTP puede llevar caído desde ayer y el feed seguir enseñando la tabla de
      # anteayer tan tranquilo, que es exactamente el fallo mudo del que se vino
      # huyendo del cron del hosting.
      #
      # Va sin freno a propósito: si el hosting está caído dos horas, son doce
      # avisos. Una alarma que se calla sola para no molestar no es una alarma, y
      # el que quiera menos ruido tiene el remedio en arreglar lo que falla.
      - name: Avisar si la pasada ha fallado
        if: failure()
        env:
          MODO: ${{ steps.modo.outputs.modo }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_AVISOS: ${{ secrets.TELEGRAM_CHAT_AVISOS }}
          TELEGRAM_CHAT_KEV: ${{ secrets.TELEGRAM_CHAT_KEV }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          aviso="🔴 <b>La pasada $MODO ha fallado</b>"
          aviso="$aviso\nLa web se queda con lo último que se publicó bien; no se ha perdido nada."
          aviso="$aviso\n<a href=\"$ENLACE\">Ver el run</a>"
          sh .github/avisar.sh "$(printf '%b' "$aviso")"
