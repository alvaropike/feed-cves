name: Sync EUVD

# Sustituye al cron del hosting. El runner es efímero, así que el estado que el
# sync necesita entre pasadas (las cachés y .notificado.json) vive en el
# servidor: se baja antes de sincronizar y se sube después.
#
# euvd_sync.mjs no tiene dependencias fuera de Node, así que no hace falta
# npm install: solo checkout, Node y a correr.

on:
  schedule:
    # Solo la pasada completa. La rápida la dispara QStash cada 10 minutos, porque
    # el schedule de GitHub no es puntual: se encola y se descarta en periodos de
    # carga alta, y pidiendo cada 15 minutos salían 3 pasadas en 8 horas.
    #
    # Esta se queda aquí a propósito, como red de seguridad: si QStash se cae o el
    # token caduca, la web sigue actualizándose cuatro veces al día en vez de
    # quedarse congelada sin que nadie se entere.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de la pasada'
        type: choice
        options: [rapido, completo]
        default: rapido

# Una pasada a la vez, igual que el cerrojo del script: dos ejecuciones
# solapadas se pisarían las cachés en el servidor.
concurrency:
  group: sync-euvd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decidir el modo de la pasada
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          PROGRAMADO: ${{ github.event.schedule }}
          ENTRADA: ${{ inputs.modo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            modo="$ENTRADA"
          elif [ "$PROGRAMADO" = "17 0,6,12,18 * * *" ]; then
            modo="completo"
          else
            modo="rapido"
          fi
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          echo "Pasada: $modo"

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Falla a propósito si no conecta: sin este corte, unas credenciales
      # malas se confundirían con "no hay estado previo" y el sync arrancaría
      # de cero, pidiendo los 5.000 títulos a cve.org y re-sembrando Telegram.
      #
      # La cuenta FTP entra directamente en el docroot del subdominio, así que
      # todo lo demás va con rutas relativas. El "ls data" lo verifica: si
      # algún día la cuenta aterrizara en otro sitio, esto corta aquí en vez de
      # subir el feed a un directorio que nadie sirve, que es exactamente el
      # fallo mudo que traía el cron del hosting.
      - name: Comprobar la conexión FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:max-retries 2
          set cmd:fail-exit yes
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          echo "--- directorio al entrar por FTP:"
          pwd
          echo "--- que hay aqui:"
          ls
          echo "--- data/ (si esto falla, no estamos en el docroot):"
          ls data
          bye
          EOF

      # Sin este paso, cada ejecución empezaría de cero: pediría los 5.000
      # títulos a cve.org y Telegram re-sembraría sin avisar nunca de nada.
      #
      # Aquí sí se toleran las ausencias (fail-exit queda en no): la primera
      # vez no habrá .notificado.json, y eso es correcto, no un error.
      - name: Traer el estado previo del servidor
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p public/data
          lftp <<EOF || true
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:max-retries 3
          set xfer:clobber on
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          mget -O public/data "data/cve_meta.json"
          mget -O public/data "data/scores_nvd.json"
          mget -O public/data "data/epss.json"
          get .notificado.json -o .notificado.json
          bye
          EOF
          echo "--- estado recuperado:"
          ls -la public/data/ 2>/dev/null || true
          if [ -f .notificado.json ]; then
            node -e 'const s=require("./.notificado.json");console.log("  .notificado.json:",Object.keys(s.avisadas||{}).length,"entradas, sembrado",s.sembrado)'
          else
            echo "  (sin .notificado.json: Telegram sembrará esta pasada sin avisar)"
          fi

      - name: Sincronizar
        env:
          MODO: ${{ steps.modo.outputs.modo }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_KEV: ${{ secrets.TELEGRAM_CHAT_KEV }}
          TELEGRAM_CHAT_CRITICAS: ${{ secrets.TELEGRAM_CHAT_CRITICAS }}
          TELEGRAM_CHAT_ALTAS: ${{ secrets.TELEGRAM_CHAT_ALTAS }}
          TELEGRAM_CHAT_MEDIAS: ${{ secrets.TELEGRAM_CHAT_MEDIAS }}
          TELEGRAM_CHAT_BAJAS: ${{ secrets.TELEGRAM_CHAT_BAJAS }}
          TELEGRAM_CHAT_SIN_PUNTUAR: ${{ secrets.TELEGRAM_CHAT_SIN_PUNTUAR }}
          # Respaldo para el montaje de un solo grupo: recoge lo que no tenga
          # sala propia, filtrado por el umbral. Vacíos si no se definen, que es
          # el valor por defecto del script.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_UMBRAL: ${{ secrets.TELEGRAM_UMBRAL }}
        run: |
          if [ "$MODO" = "completo" ]; then
            node euvd_sync.mjs
          else
            node euvd_sync.mjs --rapido
          fi

      # Se sube a .tmp y se renombra, que es lo que hacía escribir_json() en el
      # servidor: una subida de 6 MB por FTP no es atómica y un visitante podría
      # llevarse el JSON a medias. El .htaccess ya bloquea los .tmp.
      - name: Publicar en el hosting
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:max-retries 3
          set xfer:clobber on
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          put public/data/cves.json      -o "data/cves.json.tmp"
          mv "data/cves.json.tmp" "data/cves.json"
          put public/data/cve_meta.json   -o "data/cve_meta.json"
          put public/data/scores_nvd.json -o "data/scores_nvd.json"
          put public/data/epss.json       -o "data/epss.json"
          put .notificado.json            -o .notificado.json
          bye
          EOF

      - name: Resumen
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("public/data/cves.json","utf8"));
            console.log("generado:", s.generado, "| modo:", s.modo, "| total:", s.total);
          ' >> "$GITHUB_STEP_SUMMARY"
